name: Publicar no Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Apagar a cópia perdida da tentativa anterior
        continue-on-error: true
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PY'
          import os, ssl, ftplib
          host = os.environ.get("H","").replace("ftps://","").replace("ftp://","").strip("/")
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          f = ftplib.FTP_TLS(context=ctx)
          f.connect(host, 21, timeout=45)
          f.login(os.environ["U"], os.environ["P"])
          f.prot_p()
          def limpar(p):
              try:
                  for n in f.nlst(p):
                      base = n.split("/")[-1]
                      if base in (".",".."):
                          continue
                      cheio = p.rstrip("/") + "/" + base
                      try:
                          f.delete(cheio)
                      except Exception:
                          limpar(cheio)
                  f.rmd(p)
                  print("removida:", p)
              except Exception as e:
                  print("nada a remover em", p, "-", e)
          limpar("domains")
          f.quit()
          PY

      - name: Liberar os buscadores no domínio definitivo
        run: |
          printf 'User-agent: *\nAllow: /\n' > robots.txt

      - name: Enviar para a pasta do site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .nojekyll

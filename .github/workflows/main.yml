name: Publicar no Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Conferir se os segredos existem
        id: segredos
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "Segredos FTP ainda nao cadastrados; nada a publicar." >> "$GITHUB_STEP_SUMMARY"
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Liberar os buscadores no domínio definitivo
        if: steps.segredos.outputs.pronto == 'true'
        run: printf 'User-agent: *\nAllow: /\n' > robots.txt

      - name: Enviar por FTP para public_html
        if: steps.segredos.outputs.pronto == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          server-dir: public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .nojekyll

name: Publicar no Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Conferir se os segredos existem
        id: segredos
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "Segredos FTP ainda nao cadastrados; nada a publicar." >> "$GITHUB_STEP_SUMMARY"
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mapear as pastas do servidor
        if: steps.segredos.outputs.pronto == 'true'
        continue-on-error: true
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          host="${H#ftp://}"; host="${host#ftps://}"; host="${host%/}"
          for pasta in "" "domains/" "domains/navart.com.br/" "domains/navart.com.br/public_html/" "public_html/"; do
            echo "=== /$pasta ==="
            curl -s --ssl-reqd --list-only --max-time 40 --user "$U:$P" "ftp://$host/$pasta" | head -20 || echo "  (nao acessivel)"
          done

      - name: Liberar os buscadores no domínio definitivo
        if: steps.segredos.outputs.pronto == 'true'
        run: |
          printf 'User-agent: *\nAllow: /\n' > robots.txt

      - name: Enviar para a pasta do site
        if: steps.segredos.outputs.pronto == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          server-dir: domains/navart.com.br/public_html/
          local-dir: ./
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .nojekyll

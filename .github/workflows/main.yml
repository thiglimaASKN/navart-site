name: Publicar no Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Achar a pasta que o domínio serve
        id: pasta
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PY'
          import os, ssl, ftplib
          host = os.environ.get("H","").replace("ftps://","").replace("ftp://","").strip("/")
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          f = ftplib.FTP_TLS(context=ctx)
          f.connect(host, 21, timeout=45)
          f.login(os.environ["U"], os.environ["P"])
          f.prot_p()
          print("A conta FTP entra em:", f.pwd())
          for p in ["/", "/domains", "/domains/navart.com.br"]:
              print("\n=== %s ===" % p)
              try:
                  for n in sorted(f.nlst(p))[:40]:
                      print("   ", n)
              except Exception as e:
                  print("    (sem acesso):", e)
          destino = ""
          for c in ["/domains/navart.com.br/public_html", "/public_html"]:
              try:
                  f.cwd(c); destino = c; break
              except Exception:
                  pass
          print("\nDESTINO:", destino)
          open(os.environ["GITHUB_OUTPUT"],"a").write("destino=%s\n" % destino)
          f.quit()
          PY

      - name: Liberar os buscadores
        run: |
          printf 'User-agent: *\nAllow: /\n' > robots.txt

      - name: Enviar para a pasta do domínio
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          server-dir: ${{ steps.pasta.outputs.destino }}/
          local-dir: ./
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .nojekyll

name: Publicar no Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Mapear o servidor
        id: mapa
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PY'
          import os, ssl, ftplib
          host = os.environ.get("H","").replace("ftps://","").replace("ftp://","").strip("/")
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          f = ftplib.FTP_TLS(context=ctx)
          f.connect(host, 21, timeout=45)
          f.login(os.environ["U"], os.environ["P"])
          f.prot_p()
          raiz = f.pwd()
          print("A CONTA FTP ENTRA EM:", raiz)
          print()
          achados = []
          def eh_pasta(caminho):
              try:
                  f.cwd(caminho); f.cwd(raiz); return True
              except Exception:
                  return False
          def andar(caminho, nivel):
              if nivel > 4:
                  return
              try:
                  nomes = f.nlst(caminho)
              except Exception as e:
                  return
              for n in sorted(nomes)[:60]:
                  base = n.split("/")[-1]
                  if base in (".", ".."):
                      continue
                  cheio = (caminho.rstrip("/") + "/" + base) if caminho not in (".","") else base
                  if base == "index.html":
                      achados.append(cheio)
                      print("  " * nivel + "-> index.html EM: " + cheio)
                      continue
                  if eh_pasta(cheio):
                      print("  " * nivel + "[pasta] " + cheio)
                      andar(cheio, nivel + 1)
          andar(".", 0)
          print()
          print("INDEX.HTML ENCONTRADOS:", achados if achados else "nenhum")
          f.quit()
          PY
